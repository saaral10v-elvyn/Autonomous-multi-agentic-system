[project]
name = "forge-api"
version = "0.1.0"
description = "Forge API and worker scaffold"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<52",
  "fastapi>=0.115,<1",
  "litellm>=1.108.2,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "types-redis>=4.6,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "alembic.*"]
ignore_missing_imports = true
